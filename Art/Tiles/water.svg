<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- 바탕: 한 색으로 끝까지 채움 (테두리가 없어야 타일을 이어 붙여도 격자선이 보이지 않음) -->
  <rect x="0" y="0" width="16" height="16" fill="#3F6F9A"/>
  <!-- 잔물결 2개: 밝은 색, 가장자리에 닿지 않게 안쪽에 엇갈려 둠 -->
  <rect x="3" y="4" width="2" height="1" fill="#5A89B2"/>
  <rect x="5" y="5" width="2" height="1" fill="#5A89B2"/>
  <rect x="10" y="10" width="2" height="1" fill="#5A89B2"/>
  <rect x="12" y="11" width="1" height="1" fill="#5A89B2"/>
</svg>
