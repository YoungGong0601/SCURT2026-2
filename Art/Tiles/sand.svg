<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- 바탕: 한 색으로 끝까지 채움 (테두리가 없어야 타일을 이어 붙여도 격자선이 보이지 않음) -->
  <rect x="0" y="0" width="16" height="16" fill="#C8B68A"/>
  <!-- 모래알: 어두운 점 4개, 밝은 점 1개를 흩어 둠 -->
  <rect x="3" y="3" width="1" height="1" fill="#AE9B70"/>
  <rect x="11" y="4" width="1" height="1" fill="#AE9B70"/>
  <rect x="7" y="9" width="1" height="1" fill="#AE9B70"/>
  <rect x="13" y="12" width="1" height="1" fill="#AE9B70"/>
  <rect x="4" y="12" width="1" height="1" fill="#D6C69E"/>
</svg>
