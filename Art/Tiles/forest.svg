<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- 바탕: 한 색으로 끝까지 채움 (테두리가 없어야 타일을 이어 붙여도 격자선이 보이지 않음) -->
  <rect x="0" y="0" width="16" height="16" fill="#3E6439"/>
  <!-- 덤불 2개: 밝은 윗부분 + 어두운 그림자, 가장자리에 닿지 않게 엇갈려 둠 -->
  <rect x="4" y="3" width="2" height="1" fill="#517D47"/>
  <rect x="3" y="4" width="4" height="1" fill="#517D47"/>
  <rect x="4" y="5" width="2" height="1" fill="#2F4F2D"/>
  <rect x="11" y="9" width="2" height="1" fill="#517D47"/>
  <rect x="10" y="10" width="4" height="1" fill="#517D47"/>
  <rect x="11" y="11" width="2" height="1" fill="#2F4F2D"/>
</svg>
